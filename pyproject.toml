[project]
name = "geonode-scraper-cli"
version = "0.2.3"
description = "Run web scraping, website crawling, URL discovery and search from your terminal with the Geonode CLI, using JSON output for scripts and data pipelines."
authors = [
  {name = "Geonode Team"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "geonode-scraper-tools-core>=0.5.0",
  "typer>=0.12",
  "rich>=13.0",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://geonode.com/integrations/cli"
Documentation = "https://docs.geonode.com/docs/scraper-api/guides/sdks/cli"
Repository = "https://github.com/geonodecom/cli"
"Sign up" = "https://app.geonode.com/sign-up?utm_source=pypi&utm_medium=package&utm_campaign=cli"
Issues = "https://github.com/geonodecom/cli/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12.11",
]

[project.scripts]
gscraper = "geonode_scraper_cli.main:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geonode_scraper_cli*"]

[tool.setuptools.package-data]
geonode_scraper_cli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer uses function calls (typer.Option/Argument) in argument defaults by design.
"**/commands/*.py" = ["B008"]
"**/main.py" = ["B008"]
